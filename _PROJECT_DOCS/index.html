<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HermeX POS Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#0B0B0B',
                            dark: '#0E0E0E',
                            card: '#111111',
                            gold: '#D4AF37',
                            muted: 'rgba(212, 175, 55, 0.1)',
                            border: 'rgba(255, 255, 255, 0.05)',
                            hover: 'rgba(255, 255, 255, 0.03)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(212, 175, 55, 0.15)',
                        'card': '0 10px 30px -5px rgba(0, 0, 0, 0.4)',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background-color: #0B0B0B;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        
        /* Subtle radial gradient as requested */
        .bg-ambient {
            position: fixed;
            top: 0;
            right: 0;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.03) 0%, rgba(11, 11, 11, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Hide scrollbar for sidebar but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body>
    <div class="bg-ambient"></div>
    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        // --- Icons (Using SVG strings since Lucide React isn't available via simple CDN in standalone mode) ---
        const Icon = ({ name, className = "w-5 h-5", strokeWidth = 1.5 }) => {
            const icons = {
                monitor: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>',
                package: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>',
                barChart: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>',
                users: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
                settings: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>',
                bell: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
                chevronDown: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
                menu: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>',
                dollarSign: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
                trendingUp: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>',
                shoppingCart: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>',
                creditCard: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>'
            };
            
            return (
                <div 
                    className={className} 
                    dangerouslySetInnerHTML={{ __html: icons[name] || '' }} 
                />
            );
        };

        // --- Components ---

        const SidebarItem = ({ icon, label, active, onClick }) => (
            <button 
                onClick={onClick}
                className={`w-full flex items-center gap-4 px-6 py-4 transition-all duration-200 ease-in-out group
                    ${active 
                        ? 'text-brand-gold bg-brand-black border-l-4 border-brand-gold shadow-[inset_4px_0_15px_rgba(212,175,55,0.05)]' 
                        : 'text-gray-400 hover:text-white border-l-4 border-transparent hover:bg-brand-hover'
                    }`}
            >
                <div className={`${active ? 'text-brand-gold' : 'text-gray-500 group-hover:text-gray-300'} transition-colors duration-200`}>
                    <Icon name={icon} />
                </div>
                <span className="font-medium tracking-wide text-sm">{label}</span>
            </button>
        );

        const Sidebar = ({ isOpen, activeTab, setActiveTab }) => {
            const menuItems = [
                { id: 'pos', icon: 'monitor', label: 'Punto de Venta' },
                { id: 'inventory', icon: 'package', label: 'Inventario' },
                { id: 'reports', icon: 'barChart', label: 'Reportes' },
                { id: 'customers', icon: 'users', label: 'Clientes' },
                { id: 'settings', icon: 'settings', label: 'Configuración' },
            ];

            return (
                <aside className={`fixed left-0 top-0 h-screen bg-brand-dark border-r border-brand-border z-40 transition-transform duration-300 ease-in-out w-[260px] flex flex-col ${isOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                    {/* Logo Area */}
                    <div className="h-[70px] flex items-center px-8 border-b border-brand-border shrink-0">
                        <div className="flex items-center gap-3">
                            {/* Simple HermesX Logo Representation */}
                            <div className="w-8 h-8 rounded shrink-0 bg-brand-black border border-brand-gold/30 flex items-center justify-center shadow-glow">
                                <span className="text-brand-gold font-bold text-lg">H</span>
                            </div>
                            <span className="font-semibold text-xl tracking-wider text-white">Herme<span className="text-brand-gold">X</span></span>
                        </div>
                    </div>

                    {/* Navigation */}
                    <nav className="flex-1 py-6 overflow-y-auto no-scrollbar flex flex-col gap-1">
                        {menuItems.map(item => (
                            <SidebarItem 
                                key={item.id}
                                icon={item.icon}
                                label={item.label}
                                active={activeTab === item.id}
                                onClick={() => setActiveTab(item.id)}
                            />
                        ))}
                    </nav>

                    {/* Footer Area - Optional user mini-profile or logout */}
                    <div className="p-6 border-t border-brand-border">
                        <div className="text-xs text-gray-600 tracking-widest uppercase">Sistema V2.0</div>
                    </div>
                </aside>
            );
        };

        const Topbar = ({ toggleSidebar }) => (
            <header className="h-[70px] fixed top-0 right-0 left-0 lg:left-[260px] bg-brand-black/60 backdrop-blur-md border-b border-brand-border z-30 flex items-center justify-between px-6 lg:px-8 transition-all duration-300">
                <div className="flex items-center gap-4">
                    <button 
                        onClick={toggleSidebar}
                        className="lg:hidden text-gray-400 hover:text-white transition-colors"
                    >
                        <Icon name="menu" />
                    </button>
                    {/* Breadcrumbs or Page Title could go here */}
                    <div className="hidden md:block text-sm text-gray-400">
                        Dashboard <span className="mx-2 text-gray-600">/</span> <span className="text-brand-gold">Resumen General</span>
                    </div>
                </div>

                <div className="flex items-center gap-6">
                    <button className="text-gray-400 hover:text-brand-gold transition-colors relative group">
                        <Icon name="bell" />
                        <span className="absolute top-0 right-0 w-2 h-2 bg-brand-gold rounded-full shadow-[0_0_8px_rgba(212,175,55,0.8)]"></span>
                    </button>
                    
                    <div className="h-8 w-[1px] bg-brand-border"></div>

                    <button className="flex items-center gap-3 group">
                        <div className="text-right hidden sm:block">
                            <div className="text-sm font-medium text-white group-hover:text-brand-gold transition-colors">Admin Usuario</div>
                            <div className="text-xs text-gray-500">Gerencia</div>
                        </div>
                        <div className="w-10 h-10 rounded-full bg-brand-dark border border-brand-border flex items-center justify-center text-gray-400 overflow-hidden group-hover:border-brand-gold/50 transition-colors">
                            <Icon name="users" className="w-5 h-5" />
                        </div>
                        <Icon name="chevronDown" className="w-4 h-4 text-gray-500 group-hover:text-white transition-colors" />
                    </button>
                </div>
            </header>
        );

        const KpiCard = ({ title, value, icon, trend, trendValue }) => (
            <div className="bg-brand-card rounded-2xl p-6 border border-brand-border shadow-card hover:-translate-y-1 transition-all duration-200 group relative overflow-hidden">
                {/* Subtle top glare */}
                <div className="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
                
                <div className="flex justify-between items-start mb-4">
                    <div className="text-gray-400 text-sm font-medium tracking-wide">{title}</div>
                    <div className="p-2 rounded-lg bg-brand-dark border border-brand-border text-brand-gold group-hover:scale-110 group-hover:shadow-[0_0_15px_rgba(212,175,55,0.15)] transition-all duration-300">
                        <Icon name={icon} className="w-5 h-5" />
                    </div>
                </div>
                
                <div className="text-3xl font-bold text-white mb-2">{value}</div>
                
                {trend && (
                    <div className={`flex items-center text-xs font-medium gap-1 ${trend === 'up' ? 'text-green-400' : 'text-red-400'}`}>
                        <Icon name={trend === 'up' ? 'trendingUp' : 'trendingDown'} className="w-3 h-3" />
                        <span>{trendValue} vs ayer</span>
                    </div>
                )}
            </div>
        );

        const SalesChart = () => {
            const [activeTab, setActiveTab] = React.useState('Diario');
            const tabs = ['Diario', 'Semanal', 'Mensual'];

            return (
                <div className="bg-brand-card rounded-3xl p-6 border border-brand-border shadow-card lg:col-span-8 flex flex-col">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
                        <h3 className="text-lg font-semibold text-white">Ingresos Totales</h3>
                        
                        <div className="bg-brand-dark p-1 rounded-lg border border-brand-border inline-flex">
                            {tabs.map(tab => (
                                <button
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`px-4 py-1.5 text-xs font-medium rounded-md transition-colors ${
                                        activeTab === tab 
                                            ? 'bg-brand-card text-brand-gold shadow-sm border border-brand-border/50' 
                                            : 'text-gray-500 hover:text-gray-300'
                                    }`}
                                >
                                    {tab}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 relative min-h-[250px] w-full flex items-end">
                        {/* Placeholder for actual chart - building a visual representation */}
                        {/* Grid lines */}
                        <div className="absolute inset-0 flex flex-col justify-between pt-2 pb-8">
                            {[...Array(5)].map((_, i) => (
                                <div key={i} className="w-full h-[1px] bg-brand-border/50"></div>
                            ))}
                        </div>
                        
                        {/* Simulated Area Chart Path */}
                        <div className="absolute inset-0 pb-8 pl-4 pr-4">
                            <svg className="w-full h-full" preserveAspectRatio="none" viewBox="0 0 100 100">
                                <defs>
                                    <linearGradient id="goldGradient" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor="#D4AF37" stopOpacity="0.2" />
                                        <stop offset="100%" stopColor="#D4AF37" stopOpacity="0" />
                                    </linearGradient>
                                </defs>
                                <path 
                                    d="M0,100 L0,60 C10,50 20,80 30,60 C40,40 50,65 60,35 C70,5 80,45 90,20 L100,5 L100,100 Z" 
                                    fill="url(#goldGradient)" 
                                />
                                <path 
                                    d="M0,60 C10,50 20,80 30,60 C40,40 50,65 60,35 C70,5 80,45 90,20 L100,5" 
                                    fill="none" 
                                    stroke="#D4AF37" 
                                    strokeWidth="2" 
                                    className="drop-shadow-[0_0_8px_rgba(212,175,55,0.4)]"
                                />
                            </svg>
                        </div>

                        {/* X-Axis labels */}
                        <div className="absolute bottom-0 left-0 right-0 flex justify-between text-[10px] text-gray-500 px-4">
                            <span>08:00</span>
                            <span>10:00</span>
                            <span>12:00</span>
                            <span>14:00</span>
                            <span>16:00</span>
                            <span>18:00</span>
                        </div>
                    </div>
                </div>
            );
        };

        const TransactionsTable = () => {
            const transactions = [
                { id: '#TRX-0992', customer: 'Carlos Mendoza', amount: '$145.50', status: 'Pagado', date: 'Hoy, 14:32', type: 'Efectivo' },
                { id: '#TRX-0991', customer: 'Laura Jimenez', amount: '$32.00', status: 'Pagado', date: 'Hoy, 13:15', type: 'Tarjeta' },
                { id: '#TRX-0990', customer: 'Taller San Jose', amount: '$450.00', status: 'Pendiente', date: 'Hoy, 11:40', type: 'Transferencia' },
                { id: '#TRX-0989', customer: 'Miguel Santos', amount: '$85.00', status: 'Pagado', date: 'Hoy, 10:05', type: 'Tarjeta' },
                { id: '#TRX-0988', customer: 'Ana Valeria', amount: '$12.50', status: 'Pagado', date: 'Hoy, 09:22', type: 'Efectivo' },
            ];

            return (
                <div className="bg-brand-card rounded-3xl p-6 border border-brand-border shadow-card lg:col-span-4 flex flex-col overflow-hidden">
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="text-lg font-semibold text-white">Transacciones Recientes</h3>
                        <button className="text-xs text-brand-gold hover:text-white transition-colors">Ver todo</button>
                    </div>

                    <div className="flex-1 overflow-x-auto">
                        <table className="w-full text-sm text-left">
                            <thead className="text-xs text-gray-500 uppercase bg-brand-dark/50 border-b border-brand-border">
                                <tr>
                                    <th className="px-4 py-3 font-medium rounded-tl-lg">ID / Cliente</th>
                                    <th className="px-4 py-3 font-medium text-right">Monto</th>
                                    <th className="px-4 py-3 font-medium text-right rounded-tr-lg">Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                {transactions.map((trx, index) => (
                                    <tr key={trx.id} className="border-b border-brand-border/50 hover:bg-brand-hover transition-colors group">
                                        <td className="px-4 py-3">
                                            <div className="font-medium text-gray-200 group-hover:text-brand-gold transition-colors">{trx.customer}</div>
                                            <div className="text-xs text-gray-500">{trx.id} • {trx.date}</div>
                                        </td>
                                        <td className="px-4 py-3 text-right">
                                            <div className="font-medium text-white">{trx.amount}</div>
                                            <div className="text-[10px] text-gray-500">{trx.type}</div>
                                        </td>
                                        <td className="px-4 py-3 text-right">
                                            <span className={`inline-flex px-2 py-1 text-[10px] font-medium rounded border ${
                                                trx.status === 'Pagado' 
                                                    ? 'border-brand-gold/30 text-brand-gold bg-brand-gold/5' 
                                                    : 'border-yellow-600/30 text-yellow-500 bg-yellow-600/10'
                                            }`}>
                                                {trx.status}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const Dashboard = () => {
            const [sidebarOpen, setSidebarOpen] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('pos');

            // Close sidebar on mobile when resizing to desktop
            React.useEffect(() => {
                const handleResize = () => {
                    if (window.innerWidth >= 1024) {
                        setSidebarOpen(false);
                    }
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            return (
                <div className="min-h-screen bg-brand-black flex">
                    {/* Overlay for mobile sidebar */}
                    {sidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 lg:hidden"
                            onClick={() => setSidebarOpen(false)}
                        ></div>
                    )}

                    <Sidebar isOpen={sidebarOpen} activeTab={activeTab} setActiveTab={setActiveTab} />
                    
                    <div className="flex-1 lg:ml-[260px] flex flex-col min-h-screen transition-all duration-300">
                        <Topbar toggleSidebar={() => setSidebarOpen(!sidebarOpen)} />
                        
                        {/* Main Content Area */}
                        <main className="flex-1 pt-[70px] p-6 lg:p-8 w-full max-w-[1400px] mx-auto">
                            {/* KPI Row */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                                <KpiCard 
                                    title="Ventas Totales" 
                                    value="$4,250.00" 
                                    icon="dollarSign" 
                                    trend="up" 
                                    trendValue="+12.5%" 
                                />
                                <KpiCard 
                                    title="Operaciones" 
                                    value="142" 
                                    icon="creditCard" 
                                    trend="up" 
                                    trendValue="+5.2%" 
                                />
                                <KpiCard 
                                    title="Ticket Promedio" 
                                    value="$29.90" 
                                    icon="shoppingCart" 
                                    trend="down" 
                                    trendValue="-1.1%" 
                                />
                                <KpiCard 
                                    title="Nuevos Clientes" 
                                    value="18" 
                                    icon="users" 
                                    trend="up" 
                                    trendValue="+2.4%" 
                                />
                            </div>

                            {/* Main Grid: Charts & Tables */}
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                <SalesChart />
                                <TransactionsTable />
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
